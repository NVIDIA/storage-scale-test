name: Feature or enhancement suggestion
description: Suggest useful new or improved NVIDIA Storage Scale Test behavior
title: "[Enhancement]: "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Suggestions are welcome. The project is not currently accepting
        external code contributions, so please focus on the use case and desired
        behavior rather than offering a pull request.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Filesystem tests
        - Object-storage tests
        - Network tests
        - Result extraction or reporting
        - Environment validation or setup
        - Tarball or benchmark build helpers
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Use case or problem
      description: Describe the storage-testing need and why current behavior is insufficient.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Desired behavior
      description: Explain what outcome or workflow would address the need.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative tools you have tried.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Include non-sensitive examples, scale, constraints, or references.

  - type: checkboxes
    id: terms
    attributes:
      label: Submission checklist
      options:
        - label: I have searched existing issues and found no duplicate.
          required: true
        - label: I agree to follow this repository's `CODE_OF_CONDUCT.md`.
          required: true
