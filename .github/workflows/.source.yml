name: Source checks

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/pull-request/') }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  compliance:
    name: License headers
    runs-on: linux-amd64-cpu4
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check license headers
        env:
          CI_BOOTSTRAP: "0"
        run: ./utils/run_ci_checks.sh compliance

  shellcheck:
    name: ShellCheck
    runs-on: linux-amd64-cpu4
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python and restore the pip cache
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install ShellCheck
        run: python -m pip install --no-compile -c requirements-ci.txt shellcheck-py
      - name: Check shell scripts
        env:
          CI_BOOTSTRAP: "0"
        run: ./utils/run_ci_checks.sh shellcheck

  black:
    name: Black
    runs-on: linux-amd64-cpu4
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python and restore the pip cache
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install Black
        run: python -m pip install --no-compile -c requirements-ci.txt black
      - name: Check Python formatting
        env:
          CI_BOOTSTRAP: "0"
        run: ./utils/run_ci_checks.sh black

  pylint:
    name: Pylint
    runs-on: linux-amd64-cpu4
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python and restore the pip cache
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install Pylint
        run: python -m pip install --no-compile -c requirements-ci.txt pylint
      - name: Lint Python
        env:
          CI_BOOTSTRAP: "0"
        run: ./utils/run_ci_checks.sh pylint

  pytest:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: linux-amd64-cpu4
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python and restore the pip cache
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Install test dependencies
        run: >-
          python -m pip install --no-compile
          -c requirements-ci.txt
          -r requirements.txt
          pytest
      - name: Run unit tests
        env:
          CI_BOOTSTRAP: "0"
        run: ./utils/run_ci_checks.sh pytest
