name: Source release

# Publishes the stamped source archive for an annotated vMAJOR.MINOR.PATCH tag
# that is already on the default branch. See docs/VERSIONING.md.
on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Source checks
    if: github.repository == 'NVIDIA/storage-scale-test'
    permissions:
      contents: read
    uses: ./.github/workflows/.source.yml

  publish:
    name: Build and publish
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # This job holds the write token, so it installs no third-party packages:
    # the release tooling uses only the Python standard library, Git, and gh.
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build, smoke-test, and publish the source archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          python -I utils/build_source_release.py
          --tag "$RELEASE_TAG" --smoke --publish "$RELEASE_REPOSITORY"
