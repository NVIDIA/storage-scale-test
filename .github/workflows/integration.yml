name: Filesystem integration

on:
  workflow_dispatch:
  push:
    branches:
      - pull-request/[0-9]+

permissions: {}

concurrency:
  group: filesystem-integration
  cancel-in-progress: false

jobs:
  integration:
    name: Setup and test all (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: linux-amd64-cpu4
          - architecture: arm64
            runner: linux-arm64-cpu4
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Configure the package proxy
        uses: nv-gha-runners/setup-proxy-cache@eadc57871cde0c92a223d0f486ab669a2360f978 # main
        with:
          enable-apt: "true"
          enable-pip: "true"
          enable-conda: "false"
          enable-pypi-anaconda: "false"
      - name: Verify privileged runner prerequisites
        run: |
          sudo -n true
          docker info >/dev/null
      - name: Set up the integration environment
        run: sudo "$(command -v python)" integration-tests/bin/integration-test.py --storage-backend nfs setup
      - name: Verify repeated setup
        run: sudo "$(command -v python)" integration-tests/bin/integration-test.py --storage-backend nfs setup
      - name: Stop the integration environment
        run: sudo "$(command -v python)" integration-tests/bin/integration-test.py --storage-backend nfs stop
      - name: Restart the integration environment
        run: sudo "$(command -v python)" integration-tests/bin/integration-test.py --storage-backend nfs start
      - name: Verify root test execution is rejected
        run: |
          if sudo "$(command -v python)" integration-tests/bin/integration-test.py --storage-backend nfs test; then
            echo "integration test action unexpectedly accepted root" >&2
            exit 1
          fi
      - name: Run all integration tests
        run: |
          "$(command -v python)" integration-tests/bin/integration-test.py --storage-backend nfs test
      - name: Tear down the integration environment
        if: ${{ always() }}
        run: |
          sudo "$(command -v python)" integration-tests/bin/integration-test.py --storage-backend nfs teardown
          sudo "$(command -v python)" integration-tests/bin/integration-test.py --storage-backend nfs teardown

  integration-status:
    name: Filesystem integration status
    if: ${{ always() }}
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Require every architecture to pass
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$INTEGRATION_RESULT" = success
